    <script>
      // Suppress Vite HMR WebSocket connection warnings in cloud iframe/sandbox
      window.addEventListener('unhandledrejection', function(event) {
        var reason = event.reason;
        var msg = (reason && (reason.message || reason.description || String(reason))) || '';
        if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('vite') !== -1) {
          event.preventDefault();
          event.stopPropagation();
        }
      });
      window.addEventListener('error', function(event) {
        var msg = (event && (event.message || '')) || '';
        if (msg.indexOf('WebSocket') !== -1) {
          event.preventDefault();
          event.stopPropagation();
        }
      });
    </script>
